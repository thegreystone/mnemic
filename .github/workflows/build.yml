name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  codex-plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 22
          - os: windows-latest
            node: 22
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Test Codex launcher
        run: node --test plugin-codex/tests/launcher.test.mjs

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B package

      - name: Upload scenario coverage
        uses: actions/upload-artifact@v5
        with:
          name: scenario-coverage
          path: server/target/scenario-coverage.txt
          retention-days: 14

      - name: Upload uber-jar
        uses: actions/upload-artifact@v5
        with:
          name: mnemic-server
          path: server/target/mnemic-server-*-runner.jar
          retention-days: 14
