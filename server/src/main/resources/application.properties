# =============================================================================
# Mnemic MCP Server Configuration
# =============================================================================
quarkus.application.name=mnemic
# The data home: one SQLite file (mnemic.db) plus the log. Override with -Dmnemic.home=... or MNEMIC_HOME.
# DECISIONS.md §3.6: never cwd, never ~/.engram.
mnemic.home=${user.home}/.mnemic
%test.mnemic.home=target/test-data/${quarkus.uuid}

# The owner: the person "I" and "me" mean. Set MNEMIC_OWNER in the client's env. The rest are optional identities
# that resolve to the same entity: nicknames and the surname alone (MNEMIC_OWNER_ALIASES, comma-separated), e-mail
# addresses (MNEMIC_OWNER_EMAILS), the GitHub handle (MNEMIC_OWNER_GITHUB), other handles (MNEMIC_OWNER_HANDLES).
# A store used for code work wants the handle and the addresses that commits and issues carry.
#mnemic.owner=Alice Example
#mnemic.owner-aliases=Ali,Example
#mnemic.owner-emails=alice@example.com,alice.example@work.example
#mnemic.owner-github=alice-example
#mnemic.owner-handles=@alice_example
# M4 prototype P2: the sqlite-vec loadable library (vec0.dll on Windows). Unset: no vector index.
#mnemic.vec-library=C:/Users/alice/mnemic/vec0.dll
# M4 prototype P3: the ONNX Runtime shared library; status reports the probe's finding. Unset: no probe.
#mnemic.ort-library=C:/Users/alice/mnemic/onnxruntime.dll
# Semantic recall. Default (mnemic.embed=auto): on first start the embedding model (313 MB, pinned by
# hash) is fetched into the models directory in the background and loaded when there. The ONNX Runtime library
# that runs it is part of the build (unpacked from the Maven artifact when the server is built, pinned by hash,
# written to the models directory on first start); no code is ever downloaded at run time.
# every observation and fact is then embedded as it is stored, and what was stored before is embedded once the
# model is ready. status reports the state. MNEMIC_EMBED=off disables it. An explicit library and model directory
# skip the fetch; a mirror (a URL or a file: URL) serves air-gapped installs.
#mnemic.embed=auto
#mnemic.models-dir=${user.home}/.mnemic/models
#mnemic.embed-model=C:/Users/alice/mnemic/granite-embedding-311m-multilingual-r2
#mnemic.embed-model-url=file:///C:/mirrors/granite-embedding-311m-multilingual-r2
%test.mnemic.embed=off
# Size (2026-09-13, measured on Windows x64: 51.2 MB to 49.4 MB). The server talks stdio, a local SQLite file, and
# HTTPS through java.net.http (model download, hosted proposers), so TLS stays in the image but nothing else
# network-shaped is needed:
#  - no http URL handler (Quarkus adds it by default; the JDK HttpClient does not use it);
#  - the sqlite-jdbc native-image.properties is excluded because its --enable-url-protocols=jar drags the jar
#    verifier into the image; its feature (which embeds the native library for the build platform) is registered
#    by hand instead (both --exclude-config arguments are regular expressions);
#  - the AWT multimedia content handlers are the only reason java.desktop was reachable, so their service
#    provider is excluded from ServiceLoader registration.
# Verified on Windows by the native IT (stdio, SQLite, bundled ONNX Runtime from a mirror) and by a real download
# of the model over HTTPS from the binary.
quarkus.native.enable-http-url-handler=false
quarkus.native.additional-build-args=-Os,--enable-native-access=ALL-UNNAMED,\n  --exclude-config,org.xerial.sqlite-jdbc,/META-INF/native-image/org.xerial/sqlite-jdbc/native-image.properties,\n  --features=org.sqlite.nativeimage.SqliteJdbcFeature,\n  -H:ServiceLoaderFeatureExcludeServiceProviders=sun.awt.www.content.MultimediaContentHandlers
# The language of the fact layer: en (default) or de. Observations stay in the language they were said in;
# facts are rendered from the language's templates, and a change re-renders them all at the next start.
#mnemic.language=de
%test.mnemic.owner=Mattias Sandell
%test.mnemic.owner-aliases=Sandell
%test.mnemic.owner-emails=mattias@example.com
%test.mnemic.owner-github=sandell-example
%test.mnemic.owner-handles=@sandell_example
# Soft limit on observation size; larger observations are stored with a warning (EVALUATION.md I4).
mnemic.observation.soft-limit-chars=4000
# Logging: stdout is the STDIO transport, so nothing may be written to it. File log in the data home.
quarkus.log.console.enabled=false
quarkus.log.file.enabled=true
quarkus.log.file.path=${mnemic.home}/mnemic.log
# Desktop hosts start several instances at once; rotating on boot makes them fight over the file on Windows.
quarkus.log.file.rotation.rotate-on-boot=false
%test.quarkus.log.file.path=target/mnemic.log
# Uber-jar for the JVM-mode artifact
quarkus.package.jar.type=uber-jar
# Native image: embed migrations and protocol guidance as classpath resources; optimise for size.
quarkus.native.resources.includes=db/migration/*.sql,protocol/**,ai/onnxruntime/native/**
# ServiceLoader in the image: Quarkus passes -H:-UseServiceLoaderFeature unless this is set, and then
# ServiceLoader.load(ModelProvider.class) silently finds nothing (verified 2026-09-07 with a standalone image:
# default 1 provider, feature off 0, feature off + manual resource/reflection metadata 1). With this on, GraalVM
# registers every META-INF/services provider whose interface is reachable; providers need a public no-arg constructor.
quarkus.native.auto-service-loader-registration=true
# tools/list is cursor-paginated; keep the whole surface on one page for clients that do not follow cursors.
quarkus.mcp.server.tools.page-size=100

# Hybrid mode (README): a model the server asks for a proposal when the assistant sent none. Unset by default:
# the assistant proposes. Example: mnemic.proposer.model=lmstudio:proposer  (or anthropic:claude-haiku-4-5)
# mnemic.proposer.model=
# mnemic.proposer.mode=sync
# mnemic.proposer.api-key-env=
# mnemic.proposer.batch=20

